name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: mobile + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stat/mobile test:run
      - run: pnpm build

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # In-memory suite only. The Pg conformance suite (M3) needs secrets and
      # runs separately, so forks and secret-less runs still get a full gate.
      - run: pnpm test
      - run: pnpm build
